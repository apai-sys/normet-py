name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install package and test deps
        run: |
          python -m pip install -U pip
          # Install every optional extra so all tests run (and count toward
          # coverage) instead of silently skipping for missing imports.
          pip install -e ".[all,dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format check)
        run: ruff format --check src tests
      - name: Pytest with coverage
        # Measured ~72% with flaml+lgb installed; gate set just below with margin.
        # Raise further as tests are added for the causal pipeline (do_all,
        # placebo, panel) and the FLAML backend.
        env:
          MPLBACKEND: Agg
          PYTENSOR_FLAGS: "cxx="
        run: pytest --cov=normet --cov-report=term-missing --cov-fail-under=70
      - name: mypy
        run: mypy src/normet
      - name: Docs build check
        run: |
          pip install -e ".[docs]"
          sphinx-build -W docs/ docs/_build/

  # --- Probes: non-blocking, they exist to collect the breakage list ----------
  # Both jobs run the same suite under a version the pins do not yet allow, with
  # continue-on-error so they can never block a merge. Failures are read as the
  # work list for the upgrade (numpy 2.x / python 3.13), tracked in an issue —
  # the matrix is not widened until the failures are fixed.

  probe-numpy2:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: "probe: numpy 2.x (py3.12)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install package, then force numpy 2 on top
        # The numpy<2.0 pin in pyproject is deliberate while the tree is not
        # 2-clean; --no-deps overrides it without re-resolving the pin, so the
        # suite runs under numpy 2 and the breakage is collected here.
        run: |
          python -m pip install -U pip
          pip install -e ".[all,dev]"
          pip install --force-reinstall --no-deps "numpy>=2.0"
          python -c "import numpy; print('numpy', numpy.__version__)"
      - name: Test suite (the breakage is the point)
        env:
          MPLBACKEND: Agg
          PYTENSOR_FLAGS: "cxx="
        run: pytest -q

  probe-python313:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: "probe: python 3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install package and test deps
        run: |
          python -m pip install -U pip
          pip install -e ".[all,dev]"
      - name: Test suite
        env:
          MPLBACKEND: Agg
          PYTENSOR_FLAGS: "cxx="
        run: pytest -q
